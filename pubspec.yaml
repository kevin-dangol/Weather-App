name: weather_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_fonts: ^8.1.0
  http: ^1.6.0
  hugeicons: ^1.1.6
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: 'lib/assets/weather_app_icon.jpg'
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: 'lib/assets/icon_foreground.png'

flutter:
  uses-material-design: true

  assets:
    - lib/assets/cloudy.json
    - lib/assets/cloudyRain.json
    - lib/assets/little sun.json
    - lib/assets/Weather-partly cloudy.json
    - lib/assets/Weather-storm.json
    - lib/assets/Weather-snow.json
